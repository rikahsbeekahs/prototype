<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="severeBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b0714"/>
      <stop offset="60%" stop-color="#1c040b"/>
      <stop offset="100%" stop-color="#0b132b"/>
    </radialGradient>
    <radialGradient id="crimsonSun" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="20%" stop-color="#f97316"/>
      <stop offset="65%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </radialGradient>
    <filter id="severeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Background rounded card -->
  <rect width="512" height="512" rx="96" fill="url(#severeBg)"/>

  <!-- Extreme Heat Shimmer Halo -->
  <circle cx="256" cy="220" r="140" fill="#dc2626" opacity="0.18" filter="url(#severeGlow)"/>
  <circle cx="256" cy="220" r="115" fill="#f97316" opacity="0.25" filter="url(#severeGlow)"/>

  <!-- Blazing Sun with Solar Flares -->
  <circle cx="256" cy="220" r="95" fill="url(#crimsonSun)" filter="url(#severeGlow)"/>

  <!-- Solar Eruption Curves -->
  <path d="M 256 95 C 240 60 272 50 256 30 C 240 50 270 65 256 95" fill="#f59e0b" opacity="0.9"/>
  <path d="M 256 345 C 272 380 240 390 256 410 C 272 390 242 375 256 345" fill="#f59e0b" opacity="0.9"/>
  <path d="M 131 220 C 96 236 86 204 66 220 C 86 236 101 206 131 220" fill="#f59e0b" opacity="0.9"/>
  <path d="M 381 220 C 416 204 426 236 446 220 C 426 204 411 234 381 220" fill="#f59e0b" opacity="0.9"/>

  <!-- Cracked Dry Earth Silhouette at Base -->
  <path d="M 64 420 L 160 410 L 210 435 L 260 415 L 340 430 L 448 418 L 448 460 C 448 480 430 496 410 496 L 102 496 C 82 496 64 480 64 460 Z" fill="#1c070c"/>
  <path d="M 160 410 L 180 445 L 210 435 L 230 470" fill="none" stroke="#7f1d1d" stroke-width="4"/>
  <path d="M 260 415 L 275 450 L 310 440" fill="none" stroke="#7f1d1d" stroke-width="4"/>
  <path d="M 340 430 L 370 465" fill="none" stroke="#7f1d1d" stroke-width="4"/>

  <!-- Severe Emergency Warning Badge -->
  <g transform="translate(370, 70)">
    <polygon points="40,0 80,70 0,70" fill="#dc2626" stroke="#fef08a" stroke-width="4" filter="url(#severeGlow)"/>
    <text x="40" y="58" font-family="Arial, sans-serif" font-weight="bold" font-size="44" fill="#ffffff" text-anchor="middle">!</text>
  </g>
</svg>
