<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="cycloneBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#082f49"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="spiral1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="spiral2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="40%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <filter id="cycloneGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect width="512" height="512" rx="96" fill="url(#cycloneBg)"/>

  <!-- Rotating Cyclonic Spiral Vortex Arm 1 -->
  <path d="M 256 120 
           C 360 120 420 200 400 290 
           C 380 370 290 410 210 390 
           C 130 370 100 280 130 200 
           C 150 150 200 120 256 120 
           Z" 
        fill="none" stroke="url(#spiral1)" stroke-width="36" stroke-linecap="round" opacity="0.4" filter="url(#cycloneGlow)"/>

  <!-- Spiral Arm 2 (Inner Dense Feeder Band) -->
  <path d="M 256 150 
           C 330 150 380 210 365 275 
           C 350 335 285 370 225 355 
           C 165 340 140 275 160 215 
           C 175 175 215 150 256 150" 
        fill="none" stroke="url(#spiral2)" stroke-width="28" stroke-linecap="round" filter="url(#cycloneGlow)"/>

  <!-- Outer Sweeping Cyclone Tails -->
  <path d="M 256 90 C 390 90 450 190 430 310 C 410 420 290 450 180 430 C 90 410 50 300 90 190" 
        fill="none" stroke="url(#spiral1)" stroke-width="18" stroke-linecap="round"/>

  <!-- Swirling Wind Flecks -->
  <path d="M 220 220 C 270 180 320 230 290 280 C 260 320 210 290 220 240" 
        fill="none" stroke="#f0f9ff" stroke-width="12" stroke-linecap="round"/>

  <!-- Cyclone Calm Eye -->
  <circle cx="256" cy="256" r="24" fill="#020617" stroke="#38bdf8" stroke-width="6" filter="url(#cycloneGlow)"/>

  <!-- Coastal Alert Warning Badge -->
  <g transform="translate(370, 60)">
    <circle cx="36" cy="36" r="36" fill="#ef4444" stroke="#ffffff" stroke-width="4" filter="url(#cycloneGlow)"/>
    <text x="36" y="47" font-family="Arial, sans-serif" font-weight="900" font-size="34" fill="#ffffff" text-anchor="middle">!</text>
  </g>
</svg>
