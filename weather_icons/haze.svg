<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="hazeBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#242124"/>
      <stop offset="100%" stop-color="#0b132b"/>
    </radialGradient>
    <radialGradient id="dimSun" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="60%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </radialGradient>
    <linearGradient id="hazeBand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78716c" stop-opacity="0.2"/>
      <stop offset="25%" stop-color="#a8a29e" stop-opacity="0.75"/>
      <stop offset="75%" stop-color="#d6d3d1" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#78716c" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="hazeFilter" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect width="512" height="512" rx="96" fill="url(#hazeBg)"/>

  <!-- Dimmed, Diffused Sun in Hazy Sky -->
  <circle cx="256" cy="190" r="90" fill="url(#dimSun)" opacity="0.85" filter="url(#hazeFilter)"/>

  <!-- Horizontal Dry Haze & Smog Layer Bands -->
  <rect x="64" y="170" width="384" height="24" rx="12" fill="url(#hazeBand)" filter="url(#hazeFilter)"/>
  <rect x="48" y="215" width="416" height="30" rx="15" fill="url(#hazeBand)" filter="url(#hazeFilter)"/>
  <rect x="80" y="265" width="352" height="22" rx="11" fill="url(#hazeBand)" filter="url(#hazeFilter)"/>
  <rect x="56" y="310" width="400" height="28" rx="14" fill="url(#hazeBand)" filter="url(#hazeFilter)"/>
  <rect x="96" y="360" width="320" height="20" rx="10" fill="url(#hazeBand)" filter="url(#hazeFilter)"/>
  <rect x="72" y="405" width="368" height="26" rx="13" fill="url(#hazeBand)" filter="url(#hazeFilter)"/>

  <!-- Particulate dots / floating PM aerosols -->
  <g fill="#e7e5e4" opacity="0.65">
    <circle cx="120" cy="150" r="4"/>
    <circle cx="380" cy="160" r="5"/>
    <circle cx="170" cy="200" r="4"/>
    <circle cx="340" cy="250" r="4"/>
    <circle cx="150" cy="300" r="5"/>
    <circle cx="370" cy="345" r="4"/>
    <circle cx="210" cy="390" r="4"/>
    <circle cx="310" cy="420" r="5"/>
  </g>
</svg>
