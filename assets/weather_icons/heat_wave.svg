<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e102a"/>
      <stop offset="100%" stop-color="#0b132b"/>
    </radialGradient>
    <radialGradient id="sunGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="25%" stop-color="#fbbf24"/>
      <stop offset="60%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </radialGradient>
    <linearGradient id="heatWave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#f97316" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="thermoGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)"/>

  <!-- Heat Shimmer Waves -->
  <path d="M 64 360 Q 128 330 192 360 T 320 360 T 448 360" fill="none" stroke="url(#heatWave1)" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M 48 400 Q 120 370 192 400 T 336 400 T 464 400" fill="none" stroke="url(#heatWave1)" stroke-width="10" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M 80 440 Q 144 415 208 440 T 336 440 T 440 440" fill="none" stroke="url(#heatWave1)" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Blazing Sun Core -->
  <circle cx="230" cy="200" r="105" fill="url(#sunGrad)" filter="url(#glow)"/>

  <!-- Solar Rays -->
  <g stroke="#f59e0b" stroke-width="8" stroke-linecap="round" opacity="0.85">
    <line x1="230" y1="50" x2="230" y2="75"/>
    <line x1="230" y1="325" x2="230" y2="350"/>
    <line x1="80" y1="200" x2="105" y2="200"/>
    <line x1="355" y1="200" x2="380" y2="200"/>
    <line x1="124" y1="94" x2="142" y2="112"/>
    <line x1="318" y1="288" x2="336" y2="306"/>
    <line x1="124" y1="306" x2="142" y2="288"/>
    <line x1="318" y1="112" x2="336" y2="94"/>
  </g>

  <!-- Glowing Hot Thermometer -->
  <g transform="translate(320, 160) scale(0.9)" filter="url(#glow)">
    <!-- Thermometer Tube Glass Background -->
    <rect x="24" y="20" width="32" height="180" rx="16" fill="#1e293b" stroke="#475569" stroke-width="4"/>
    <circle cx="40" cy="210" r="32" fill="#1e293b" stroke="#475569" stroke-width="4"/>

    <!-- Mercury Fill (High Temp) -->
    <rect x="30" y="45" width="20" height="155" rx="10" fill="url(#thermoGrad)"/>
    <circle cx="40" cy="210" r="24" fill="#dc2626"/>

    <!-- Level ticks -->
    <line x1="62" y1="60" x2="72" y2="60" stroke="#f87171" stroke-width="3"/>
    <line x1="62" y1="90" x2="76" y2="90" stroke="#f87171" stroke-width="3"/>
    <line x1="62" y1="120" x2="72" y2="120" stroke="#f87171" stroke-width="3"/>
    <line x1="62" y1="150" x2="76" y2="150" stroke="#f87171" stroke-width="3"/>
  </g>
</svg>
