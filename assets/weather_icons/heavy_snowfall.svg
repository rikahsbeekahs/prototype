<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="snowBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f2b48"/>
      <stop offset="60%" stop-color="#091b30"/>
      <stop offset="100%" stop-color="#0b132b"/>
    </radialGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="60%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="snowGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <filter id="iceGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect width="512" height="512" rx="96" fill="url(#snowBg)"/>

  <!-- Snowy Mountain Ridge Silhouette at base -->
  <polygon points="48,460 160,340 260,420 380,310 464,440 464,496 48,496" fill="#1e293b"/>
  <!-- Mountain Snow Caps -->
  <polygon points="160,340 130,375 160,370 185,378" fill="#e0f2fe"/>
  <polygon points="380,310 345,350 380,345 410,355" fill="#e0f2fe"/>

  <!-- Volumetric Snow Cloud -->
  <g filter="url(#iceGlow)">
    <circle cx="180" cy="190" r="60" fill="url(#cloudGrad)"/>
    <circle cx="260" cy="150" r="75" fill="url(#cloudGrad)"/>
    <circle cx="340" cy="185" r="55" fill="url(#cloudGrad)"/>
    <rect x="150" y="180" width="220" height="70" rx="35" fill="url(#cloudGrad)"/>
  </g>

  <!-- Snowflake Definition Template Macro -->
  <!-- Flake 1 (Center Large) -->
  <g transform="translate(256, 290) scale(0.9)" stroke="url(#snowGlow)" stroke-width="4" stroke-linecap="round" filter="url(#iceGlow)">
    <line x1="0" y1="-30" x2="0" y2="30"/>
    <line x1="-26" y1="-15" x2="26" y2="15"/>
    <line x1="-26" y1="15" x2="26" y2="-15"/>
    <!-- Chevrons -->
    <path d="M -8 -20 L 0 -14 L 8 -20"/>
    <path d="M -8 20 L 0 14 L 8 20"/>
    <path d="M -18 -2 L -12 -7 L -17 -14"/>
    <path d="M 18 2 L 12 7 L 17 14"/>
    <path d="M -18 2 L -12 7 L -17 14"/>
    <path d="M 18 -2 L 12 -7 L 17 -14"/>
  </g>

  <!-- Flake 2 (Left Medium) -->
  <g transform="translate(160, 320) scale(0.65)" stroke="url(#snowGlow)" stroke-width="5" stroke-linecap="round" filter="url(#iceGlow)">
    <line x1="0" y1="-28" x2="0" y2="28"/>
    <line x1="-24" y1="-14" x2="24" y2="14"/>
    <line x1="-24" y1="14" x2="24" y2="-14"/>
    <path d="M -8 -18 L 0 -12 L 8 -18"/>
    <path d="M -8 18 L 0 12 L 8 18"/>
  </g>

  <!-- Flake 3 (Right Medium) -->
  <g transform="translate(360, 310) scale(0.65)" stroke="url(#snowGlow)" stroke-width="5" stroke-linecap="round" filter="url(#iceGlow)">
    <line x1="0" y1="-28" x2="0" y2="28"/>
    <line x1="-24" y1="-14" x2="24" y2="14"/>
    <line x1="-24" y1="14" x2="24" y2="-14"/>
    <path d="M -8 -18 L 0 -12 L 8 -18"/>
    <path d="M -8 18 L 0 12 L 8 18"/>
  </g>

  <!-- Flake 4 (Center Low) -->
  <g transform="translate(230, 380) scale(0.55)" stroke="url(#snowGlow)" stroke-width="5" stroke-linecap="round">
    <line x1="0" y1="-24" x2="0" y2="24"/>
    <line x1="-21" y1="-12" x2="21" y2="12"/>
    <line x1="-21" y1="12" x2="21" y2="-12"/>
  </g>

  <!-- Flake 5 (Left Low) -->
  <g transform="translate(120, 390) scale(0.5)" stroke="url(#snowGlow)" stroke-width="5" stroke-linecap="round">
    <line x1="0" y1="-24" x2="0" y2="24"/>
    <line x1="-21" y1="-12" x2="21" y2="12"/>
    <line x1="-21" y1="12" x2="21" y2="-12"/>
  </g>

  <!-- Flake 6 (Right Low) -->
  <g transform="translate(400, 395) scale(0.5)" stroke="url(#snowGlow)" stroke-width="5" stroke-linecap="round">
    <line x1="0" y1="-24" x2="0" y2="24"/>
    <line x1="-21" y1="-12" x2="21" y2="12"/>
    <line x1="-21" y1="12" x2="21" y2="-12"/>
  </g>

  <!-- Dense Falling Snow Dots / Blizzard Particles -->
  <g fill="#e0f2fe" opacity="0.8">
    <circle cx="110" cy="270" r="4"/>
    <circle cx="190" cy="260" r="5"/>
    <circle cx="210" cy="330" r="4"/>
    <circle cx="290" cy="250" r="5"/>
    <circle cx="310" cy="340" r="4"/>
    <circle cx="330" cy="270" r="4"/>
    <circle cx="420" cy="280" r="5"/>
    <circle cx="280" cy="390" r="4"/>
    <circle cx="330" cy="420" r="5"/>
    <circle cx="180" cy="420" r="4"/>
  </g>
</svg>
